[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "container-openvdb"
version = "0.1.0"
description = "Typed Python data bridge for Container OpenVdbTool"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["container_openvdb*"]

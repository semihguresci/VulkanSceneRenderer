name: Robotics Physics Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_version:
        description: 'Optional paired robotics preview archive version (for example, 0.3.0-preview.1)'
        type: string
        default: ''

permissions:
  contents: read

env:
  VULKAN_SDK_VERSION: '1.4.363.1'

jobs:
  windows-robotics:
    name: Windows robotics (${{ matrix.profile }})
    runs-on: windows-2025-vs2026
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_version != '' && matrix.profile == 'physics-only' && 150 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: full
            physics: 'ON'
            urdf: 'ON'
          - profile: physics-only
            physics: 'ON'
            urdf: 'OFF'
          - profile: urdf-only
            physics: 'OFF'
            urdf: 'ON'
          - profile: minimal
            physics: 'OFF'
            urdf: 'OFF'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/robotics-vcpkg-cache
          key: windows-2025-vs2026-x64-robotics-vcpkg-${{ env.VULKAN_SDK_VERSION }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**') }}

      - name: Provision Vulkan SDK for CMake configure
        shell: pwsh
        run: |
          # The shared configure finds Vulkan and slangc even for these CPU-only targets.
          $sdkVersion = $env:VULKAN_SDK_VERSION
          $sdkSha256 = 'C02932BD9A968B22D404536108ADAACAC908C081CD6B0113F5BFEFC523DD0A6A'
          $installerName = "vulkansdk-windows-X64-$sdkVersion.exe"
          $installer = Join-Path $env:RUNNER_TEMP $installerName
          $sdk = Join-Path $env:RUNNER_TEMP "VulkanSDK/$sdkVersion"
          $download = @{
            Uri = "https://sdk.lunarg.com/sdk/download/$sdkVersion/windows/$installerName"
            OutFile = $installer
            MaximumRetryCount = 3
          }
          Invoke-WebRequest @download
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $sdkSha256) {
            throw "Vulkan SDK $sdkVersion installer SHA256 mismatch."
          }

          $setupArgs = @('--root', ('"{0}"' -f $sdk), '--accept-licenses', '--default-answer',
                         '--confirm-command', 'install', 'copy_only=1')
          $setup = Start-Process -FilePath $installer -ArgumentList $setupArgs -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            throw "Vulkan SDK installer exited with code $($setup.ExitCode)."
          }
          foreach ($component in 'Include/vulkan/vulkan.h', 'Lib/vulkan-1.lib', 'Bin/slangc.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $sdk $component) -PathType Leaf)) {
              throw "Vulkan SDK installer did not provide $component."
            }
          }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV

      - name: Provision the pinned Windows preview loader
        if: github.event_name == 'workflow_dispatch' && inputs.preview_version != '' && matrix.profile == 'physics-only'
        shell: pwsh
        env:
          PREVIEW_VERSION: ${{ inputs.preview_version }}
        run: |
          if ($env:PREVIEW_VERSION -cnotmatch '\Av?[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?\z') {
            throw 'preview_version must look like 0.3.0-preview.1.'
          }
          $component = 'VulkanRT-X64-1.4.363.0-Components'
          $loaderZip = Join-Path $env:RUNNER_TEMP "$component.zip"
          $download = @{
            Uri = "https://sdk.lunarg.com/sdk/download/1.4.363.0/windows/$component.zip"
            OutFile = $loaderZip
            MaximumRetryCount = 3
          }
          Invoke-WebRequest @download
          if ((Get-FileHash -LiteralPath $loaderZip -Algorithm SHA256).Hash -ne 'A25A927AA8B9F0371048F1861CF88AC3B9BC9B1FB332C42D897C8AB32695769A') {
            throw 'The LunarG runtime components archive SHA-256 did not match.'
          }
          Expand-Archive -LiteralPath $loaderZip -DestinationPath $env:RUNNER_TEMP
          $components = Join-Path $env:RUNNER_TEMP $component
          $loader = Join-Path $env:RUNNER_TEMP 'robotics-preview-loader'
          New-Item -ItemType Directory -Path $loader | Out-Null
          Copy-Item -LiteralPath "$components/x64/vulkan-1.dll", "$components/VulkanRT-License.txt" -Destination $loader
          "PREVIEW_LOADER_ROOT=$loader" >> $env:GITHUB_ENV

      - name: Configure and build headless robotics targets
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.temp }}/robotics-vcpkg-cache,readwrite"
          VCPKG_KEEP_ENV_VARS: VULKAN_SDK
          PREVIEW_VERSION: ${{ inputs.preview_version }}
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw 'Visual Studio C++ build tools are required.'
          }
          & (Join-Path $vs 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          if (-not (Test-Path -LiteralPath (Join-Path $env:VCPKG_ROOT 'scripts/buildsystems/vcpkg.cmake') -PathType Leaf)) {
            throw 'The runner vcpkg toolchain was not found.'
          }
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'robotics-vcpkg-cache') | Out-Null

          $options = @(
            '-DVCPKG_TARGET_TRIPLET=x64-windows'
            "-DVulkan_INCLUDE_DIR=$env:VULKAN_SDK/Include"
            "-DVulkan_LIBRARY=$env:VULKAN_SDK/Lib/vulkan-1.lib"
            '-DENABLE_TESTS=ON'
            '-DENABLE_PHYSICS=${{ matrix.physics }}'
            '-DENABLE_WINDOWED_TESTS=OFF'
            '-DENABLE_VULKAN_VALIDATION_LAYERS=OFF'
            '-DENABLE_RENDERER_MCP=OFF'
            '-DENABLE_TINYUSDZ_USD_LOADER=OFF'
            '-DENABLE_OPENVDB=OFF'
            '-DENABLE_ROBOTICS_URDF=${{ matrix.urdf }}'
            '-DENABLE_SAMPLE_MODEL_DOWNLOAD=OFF'
            '-DENABLE_BIM_SAMPLE_MODEL_DOWNLOAD=OFF'
            '-DENABLE_USD_SAMPLE_MODEL_DOWNLOAD=OFF'
          )
          if ($env:PREVIEW_LOADER_ROOT) {
            $options += "-DCONTAINER_VULKAN_LOADER_ROOT=$env:PREVIEW_LOADER_ROOT"
          }
          cmake --preset windows-release @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & ./tests/robotics/run_validation.ps1 -BuildDirectory out/build/windows-release `
              -Profile '${{ matrix.profile }}' -Phase Build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($env:PREVIEW_LOADER_ROOT) {
            $build = 'out/build/windows-release'
            cmake --build $build --parallel 4 --target VulkanSceneRenderer OpenVdbTransportRender `
                BimRoboticsSim BimRoboticsNavMap BimRoboticsCollision BimRoboticsDataset
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ./cmake/package_windows.ps1 -Version $env:PREVIEW_VERSION -RuntimeDirectory $build `
                -BuildDirectory $build -VcpkgInstalledDirectory "$build/vcpkg_installed" `
                -IncludeRoboticsPreview -OutputDirectory out/robotics-preview-windows
          }

      - name: Save vcpkg binaries
        if: ${{ !cancelled() && matrix.profile == 'full' && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/robotics-vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Run the selected robotics regression profile
        shell: pwsh
        run: |
          & ./tests/robotics/run_validation.ps1 -BuildDirectory out/build/windows-release `
              -Profile '${{ matrix.profile }}' -Phase Test

      - name: Check the Windows preview from an extracted archive
        if: success() && github.event_name == 'workflow_dispatch' && inputs.preview_version != '' && matrix.profile == 'physics-only'
        shell: pwsh
        env:
          PREVIEW_VERSION: ${{ inputs.preview_version }}
        run: |
          $packages = 'out/robotics-preview-windows'
          $name = "VulkanSceneRenderer-$env:PREVIEW_VERSION-windows-x64-robotics-preview"
          $archive = "$packages/$name.zip"
          $expected = (Get-Content -LiteralPath "$archive.sha256" -Raw).Split(' ')[0]
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'The Windows preview archive SHA-256 did not match its sidecar.'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'relocated robotics preview'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $runtime = Join-Path $destination $name
          $metadata = Get-Content -LiteralPath "$runtime/build-info.json" -Raw | ConvertFrom-Json
          if ($metadata.source_commit -ne $env:GITHUB_SHA -or $metadata.version -ne $env:PREVIEW_VERSION -or -not $metadata.robotics_preview) {
            throw 'The extracted Windows archive has incorrect preview metadata.'
          }
          $metadata.source_commit | Set-Content -LiteralPath "$packages/source-commit.txt" -Encoding ascii
          Push-Location -LiteralPath $runtime
          try {
            foreach ($tool in 'BimRoboticsSim', 'BimRoboticsNavMap', 'BimRoboticsCollision', 'BimRoboticsDataset') {
              & "./$tool.exe" --help
              if ($LASTEXITCODE -ne 0) { throw "Packaged $tool failed with exit code $LASTEXITCODE." }
            }
          } finally {
            Pop-Location
          }

      - name: Upload the Windows robotics preview
        if: success() && github.event_name == 'workflow_dispatch' && inputs.preview_version != '' && matrix.profile == 'physics-only'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robotics-preview-windows-x64
          path: |
            out/robotics-preview-windows/*.zip
            out/robotics-preview-windows/*.zip.sha256
            out/robotics-preview-windows/source-commit.txt
          if-no-files-found: error
          compression-level: 0

      - name: Stage the Nav2 maps and physical verifier
        id: nav2-input
        if: success() && matrix.profile == 'physics-only'
        shell: pwsh
        run: |
          $build = (Resolve-Path -LiteralPath 'out/build/windows-release').Path
          $cases = @(Get-ChildItem -LiteralPath "$build/test_results/bim-nav2-map" -Filter cases.json -File -Recurse)
          if ($cases.Count -ne 1) { throw 'Expected one generated Nav2 fixture bundle.' }
          $native = Join-Path $env:RUNNER_TEMP 'nav2-collision'
          New-Item -ItemType Directory -Path $native | Out-Null
          Copy-Item -LiteralPath "$build/BimRoboticsCollision.exe" -Destination $native
          foreach ($dll in (Get-ChildItem -LiteralPath $build -File -Filter '*.dll')) {
            Copy-Item -LiteralPath $dll.FullName -Destination $native
          }
          "maps=$($cases[0].DirectoryName)" >> $env:GITHUB_OUTPUT
          "native=$native" >> $env:GITHUB_OUTPUT

      - name: Upload Nav2 fixture maps
        if: success() && matrix.profile == 'physics-only'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bim-nav2-fixture-maps
          path: ${{ steps.nav2-input.outputs.maps }}
          if-no-files-found: error

      - name: Upload BIM physical verifier
        if: success() && matrix.profile == 'physics-only'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bim-nav2-collision-verifier
          path: ${{ steps.nav2-input.outputs.native }}
          if-no-files-found: error

      - name: Upload headless validation evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robotics-headless-validation-${{ matrix.profile }}
          if-no-files-found: error
          path: |
            out/build/windows-release/robotics-validation/
            out/build/windows-release/test_results/bim-fixed-step-replay/summary.json

      - name: Upload physics failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robotics-validation-failure-${{ matrix.profile }}
          if-no-files-found: ignore
          path: |
            out/build/windows-release/Testing/Temporary/
            out/build/windows-release/robotics-validation/
            out/build/windows-release/CMakeFiles/CMakeConfigureLog.yaml
            out/build/windows-release/test_results/bim-fixed-step-replay/
            out/build/windows-release/test_results/bim-nav2-map/

  nav2-planner:
    name: Nav2 Jazzy map and planner
    needs: windows-robotics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ros:jazzy-ros-base-noble@sha256:3f3a309d342b0f8a9212d195a416d5c50deb1716edc8bdfe5e134bcaa38d708c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bim-nav2-fixture-maps
          path: out/nav2-maps

      - name: Install Nav2 planner components
        shell: bash
        run: |
          mkdir -p out/nav2-planner
          packages=(ros-jazzy-rclpy ros-jazzy-nav2-map-server ros-jazzy-nav2-planner
                    ros-jazzy-nav2-navfn-planner ros-jazzy-tf2-ros-py python3-yaml)
          apt-get update
          apt-get install -y --no-install-recommends "${packages[@]}"
          dpkg-query -W "${packages[@]}" > out/nav2-planner/packages.txt

      - name: Load the BIM maps and plan fixture routes
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 -B tests/robotics/bim_nav2_planner.py --maps out/nav2-maps \
            --output out/nav2-planner/paths.json --log-dir out/nav2-planner/logs

      - name: Upload Nav2 planner evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bim-nav2-planner-results
          path: out/nav2-planner/
          if-no-files-found: error

  nav2-physical-verification:
    name: Sweep Nav2 routes against the BIM source
    needs: nav2-planner
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bim-nav2-fixture-maps
          path: out/nav2-maps

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bim-nav2-planner-results
          path: out/nav2-planner

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bim-nav2-collision-verifier
          path: out/nav2-collision

      - name: Verify the returned routes against native geometry
        shell: pwsh
        run: |
          python -B tests/robotics/bim_nav2_map.py --collision out/nav2-collision/BimRoboticsCollision.exe `
            --fixtures tests/fixtures/robotics --output out/nav2-maps `
            --verify-nav2 out/nav2-planner/paths.json
          exit $LASTEXITCODE

      - name: Upload physical route evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bim-nav2-physical-verification
          path: out/nav2-maps/nav2-sweeps.json
          if-no-files-found: warn

  ros2-contract:
    name: ROS 2 Jazzy headless contract
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: ros:jazzy-ros-base-noble@sha256:3f3a309d342b0f8a9212d195a416d5c50deb1716edc8bdfe5e134bcaa38d708c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the native build tools and ROS dependencies
        shell: bash
        run: |
          mkdir -p out/ros2-contract out/ros2-vcpkg-cache
          export DEBIAN_FRONTEND=noninteractive
          packages=(build-essential cmake git curl ca-certificates ninja-build pkg-config zip unzip
                    libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
                    libxt-dev libxkbcommon-dev libwayland-dev libegl-dev libgl-dev
                    autoconf automake libtool bison gperf python3 python3-yaml python3-colcon-common-extensions
                    ros-jazzy-builtin-interfaces ros-jazzy-geometry-msgs ros-jazzy-nav-msgs
                    ros-jazzy-launch-ros ros-jazzy-rclpy ros-jazzy-ros2launch ros-jazzy-rosgraph-msgs ros-jazzy-sensor-msgs
                    ros-jazzy-navigation2 ros-jazzy-nav2-bringup ros-jazzy-rosbag2-storage-mcap ros-jazzy-ros2bag
                    ros-jazzy-tf2-msgs ros-jazzy-tf2-ros-py)
          apt-get update
          apt-get install -y --no-install-recommends "${packages[@]}"
          dpkg-query -W "${packages[@]}" > out/ros2-contract/packages.txt

      - name: Check out the pinned vcpkg toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: 5f8c424e267b7360d451df406eeefb3767985b17
          path: out/ros2-vcpkg
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Check out Vulkan headers for CMake configure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: 6802bb4733b63ed5efd3adb308a6c885ef180ea1 # v1.4.363
          path: out/ros2-vulkan-headers
          persist-credentials: false

      - name: Restore vcpkg binaries
        id: ros2-vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: out/ros2-vcpkg-cache
          key: ubuntu-24.04-jazzy-x64-robotics-vcpkg-5f8c424e-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**') }}

      - name: Build the native headless robotics tools
        shell: bash
        run: |
          # The shared configure discovers Vulkan and slangc even for headless targets.
          export VCPKG_ROOT="$PWD/out/ros2-vcpkg"
          export VCPKG_MAX_CONCURRENCY=4
          export VCPKG_BINARY_SOURCES="clear;files,$PWD/out/ros2-vcpkg-cache,readwrite"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          build="$PWD/out/build/linux-ros2-contract"
          cmake --preset linux-release -B "$build" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVulkan_INCLUDE_DIR="$PWD/out/ros2-vulkan-headers/include" \
            -DSLANGC_EXECUTABLE="$build/vcpkg_installed/x64-linux/tools/shader-slang/slangc" \
            -DENABLE_TESTS=OFF -DENABLE_PHYSICS=ON -DENABLE_ROBOTICS_URDF=OFF \
            -DENABLE_VULKAN_VALIDATION_LAYERS=OFF -DENABLE_RENDERER_MCP=OFF \
            -DENABLE_TINYUSDZ_USD_LOADER=OFF -DENABLE_OPENVDB=OFF \
            -DENABLE_SAMPLE_MODEL_DOWNLOAD=OFF -DENABLE_BIM_SAMPLE_MODEL_DOWNLOAD=OFF \
            -DENABLE_USD_SAMPLE_MODEL_DOWNLOAD=OFF 2>&1 | tee out/ros2-contract/native-configure.log
          cmake --build "$build" --parallel 4 --target BimRoboticsSim BimRoboticsNavMap BimRoboticsCollision \
            2>&1 | tee out/ros2-contract/native-build.log

      - name: Save vcpkg binaries
        if: steps.ros2-vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: out/ros2-vcpkg-cache
          key: ${{ steps.ros2-vcpkg-cache.outputs.cache-primary-key }}

      - name: Build and install the optional ROS bridge
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon --log-base out/ros2-contract/colcon-log build --paths ros2/bim_ros_bridge \
            --build-base out/build/ros2-contract-bridge --install-base out/ros2-contract-bridge

      - name: Check the native simulator and the live ROS contracts without a Vulkan driver
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source out/ros2-contract-bridge/local_setup.bash
          export VK_DRIVER_FILES="$PWD/out/ros2-contract/no-vulkan-icd.json"
          simulator="$PWD/out/build/linux-ros2-contract/BimRoboticsSim"
          python3 -B tests/robotics/bim_drive_stream.py --executable "$simulator" \
            --fixtures tests/fixtures/robotics 2>&1 | tee out/ros2-contract/native-stream.log
          python3 -B - "$simulator" <<'PY'
          import math
          from pathlib import Path
          import subprocess
          import sys

          simulator = sys.argv[1]
          fixtures = Path("tests/fixtures/robotics")
          planar = [4.0, 3 * math.sqrt(2), 3.0] + [math.inf] * 5
          layered = [2.5] * 8 + planar + [distance / math.cos(math.pi / 12) for distance in planar]
          for flag, case, ranges in (("--scan", "planar", planar), ("--cloud", "layered", layered)):
              command = [sys.executable, "-B", "tests/robotics/bim_ros2_contract.py", "--sim-executable", simulator,
                         "--scene", str(fixtures / "lidar-corner.ifc"), "--namespace", "ros-contract-corner",
                         "--scenario", str(fixtures / f"lidar-corner-ros2-{case}.json"),
                         "--camera", str(fixtures / "doorway-ros2-camera.json"),
                         "--output", f"out/ros2-contract/{case}", flag]
              for beam, metres in enumerate(ranges):
                  command.extend(("--expect-range", f"{beam}={metres}"))
              subprocess.run(command, check=True, timeout=60)
          PY

      - name: Run the Nav2 preview from an extracted archive
        shell: bash
        env:
          PREVIEW_VERSION: ${{ inputs.preview_version }}
        run: |
          source /opt/ros/jazzy/setup.bash
          evidence="$PWD/out/ros2-contract"
          version="${PREVIEW_VERSION:-0.1.0-ci}"
          if [[ ! "$version" =~ ^v?[0123456789]+\.[0123456789]+\.[0123456789]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo 'preview_version must look like 0.3.0-preview.1.' >&2
            exit 1
          fi
          package="VulkanSceneRenderer-$version-linux-x64-nav2-preview"
          python3 -B tools/package_bim_nav2_preview.py --build-dir out/build/linux-ros2-contract \
            --version "$version" --output "$evidence/packages" | tee "$evidence/preview-package.log"
          git rev-parse HEAD > "$evidence/packages/source-commit.txt"
          (
            cd "$evidence/packages"
            sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
          )
          install_dir="$(mktemp -d)/relocated preview"
          mkdir -p "$install_dir"
          tar -xzf "$evidence/packages/$package.tar.gz" -C "$install_dir"
          export VK_DRIVER_FILES="$evidence/no-vulkan-icd.json"
          cd /tmp
          python3 -B "$install_dir/$package/tools/bim_nav2_preview.py" \
            --output "$evidence/preview" | tee "$evidence/preview.log"

      - name: Upload the Linux Nav2 preview
        if: success() && github.event_name == 'workflow_dispatch' && inputs.preview_version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robotics-preview-linux-x64
          path: out/ros2-contract/packages/
          if-no-files-found: error
          compression-level: 0

      - name: Upload ROS 2 contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bim-ros2-jazzy-contract
          path: out/ros2-contract/
          if-no-files-found: warn
